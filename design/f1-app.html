<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFCFB">
<title>X师傅美食记</title>
<style>
/* ================================================================
   X师傅美食记 — F1 菜品墙 · 完整原型
   配色：Radix UI Colors（sand 灰阶）+ 朱红强调（#8c3a2e，用户指定的旧版印章红）：
   1–2 步做页面底，3–5 步做面，6–8 步做边框，11–12 步做文字。
   墙 = 4 列 masonry、双向无限；其余屏都是"从墙上翻开的一张纸"。
   ================================================================ */

:root{
  /* ---------- Radix sand（暖灰，对应纸感）---------- */
  --sand-1:#fdfcfb;
  --sand-2:#f9f8f7;
  --sand-3:#f1efee;
  --sand-4:#e9e7e4;
  --sand-5:#e2dfdb;
  --sand-6:#d9d5d1;
  --sand-7:#cdc8c3;
  --sand-8:#bbb5ae;
  --sand-9:#8d8880;
  --sand-10:#7c766e;
  --sand-11:#605d58;
  --sand-12:#1f1d1a;

  /* ---------- 朱红（强调色，用户指定的旧版印章红；全站唯一红）---------- */
  --zhu:#8c3a2e;

  /* ---------- 语义层（Radix 用法）----------
     页底 1–2 步、面 2–4 步（页底本就该用最浅两步，给强调色与小字留足对比余量） */
  --backdrop:#000000;            /* 舞台底：Radix black */
  --paper:var(--sand-2);        /* 页面底：2 步 */
  --paper-hi:var(--sand-1);     /* 最亮的底（墙背板） */
  --paper-2:var(--sand-3);      /* 次级面 */
  --paper-3:var(--sand-4);      /* 再深一档 */
  --card:var(--sand-1);         /* 纸卡：比页底亮一档，纸上红字 4.9:1 */
  --ink:var(--sand-12);         /* 正文：12 步 */
  --ink-hover:var(--sand-11);
  --red:var(--zhu);              /* 强调：朱红 */
  --red-strong:var(--zhu);       /* 强调面：同色（旧版单红体系） */

  /* 文字层级：11 步正文 / 9 步次要 / 8 步弱化 */
  --text:var(--sand-12);
  --text-muted:var(--sand-11);
  --text-subtle:var(--sand-9);
  --on-accent:#fff8f6;
  --on-ink-strong:var(--sand-1);
  --on-ink-subtle:rgba(253,252,251,.55);

  /* 边框：6 步弱 / 8 步强 */
  --border-subtle:var(--sand-6);
  --border-strong:var(--sand-8);
  --surface-hover:var(--sand-4);

  /* 兼容旧变量名，避免大范围改动。
     旧 --ink-40 是 alpha .62（旧纸底上约 5:1），Radix 下要落到 sand-11（5.2:1），
     不能落到 sand-9（3.07:1，只够大字/图形用）。--ink-70 旧文件就未定义过，一并补上。 */
  --ink-72:var(--text-muted);
  --ink-70:var(--text-muted);
  --ink-66:var(--text-muted);
  --ink-62:var(--text-muted);
  --ink-40:var(--text-muted);
  --ink-55:var(--text-muted);
  --ink-16:var(--border-subtle);

  /* 评分色阶：用深浅表达"分量"
     1–2 分 → sand-12（最沉）· 3 分 → sand-9 · 4 分 → sand-11 · 5 分 → 朱红（唯一强调） */
  --r-low:var(--sand-12);
  --r-mid:var(--sand-9);
  --r-high:var(--zhu);

  /* 字号：只三档（正文 12 / 强调 15 / 标题 30），大字用 clamp 撑开 */
  --fs-body:12px;
  --fs-lead:15px;
  --fs-title:30px;

  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun","STSong",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  /* 动效：基础 250ms ease-out，只有一处例外（页面转场需要更从容） */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease:var(--ease-out);
  --dur:250ms;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--backdrop);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{position:fixed;inset:0;display:grid;place-items:center}

.phone{
  position:relative;width:390px;height:844px;overflow:hidden;
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  border-radius:30px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  user-select:none;-webkit-user-select:none;
}
.phone input,.phone textarea{user-select:text;-webkit-user-select:text}

.grain{
  position:absolute;inset:0;z-index:96;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background-image:radial-gradient(var(--text-muted) .5px,transparent .6px);background-size:3px 3px;
}

/* ---------- 状态栏 ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:90;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 9px;pointer-events:none}
.statusbar__time{font-size:15px;font-weight:600;letter-spacing:.02em;line-height:1}
.statusbar__icons{display:flex;align-items:center;gap:6px;transform:translateY(-1px)}
.sb-bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.sb-bars i{display:block;width:2.5px;background:var(--ink);border-radius:.5px}
.sb-bars i:nth-child(1){height:3px}
.sb-bars i:nth-child(2){height:5px}
.sb-bars i:nth-child(3){height:7.5px}
.sb-bars i:nth-child(4){height:10px}
.sb-5g{font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1}
.sb-batt{position:relative;width:21px;height:10.5px;border:0.5px solid var(--text-subtle);border-radius:2.5px;padding:1.5px}
.sb-batt i{display:block;height:100%;width:72%;background:var(--ink);border-radius:1px}
.sb-batt::after{content:"";position:absolute;right:-2.5px;top:50%;transform:translateY(-50%);width:1.5px;height:4px;background:var(--text-subtle);border-radius:0 1px 1px 0}

/* ---------- 首页：两行报头 ---------- */
/* .home 必须是定位祖先：.counter / .fab / .toLatest 都用 absolute + bottom 相对它 */
.home{position:absolute;inset:0;z-index:1}
.masthead{
  position:absolute;top:52px;left:0;right:0;z-index:69;
  padding:0 12px;background:var(--paper);display:flex;flex-direction:column;
}
.masthead__row{height:32px;flex:0 0 auto;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.brand__mark{display:block;width:7px;height:7px;background:var(--red)}
.brand__name{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1;letter-spacing:.01em;white-space:nowrap}
.brand__stat{margin-left:auto;font-family:var(--mono);font-size:12px;line-height:1;letter-spacing:.08em;color:var(--ink-62);white-space:nowrap}
.brand__stat b{font-weight:400;color:var(--ink)}
/* 四个入口：一行四格，无边框，当前项朱砂下划线。
   改前是 1.5px 黑框 + 四等分 —— 那种方框在 40px 高里只放 10.5px 的字，
   四周全是空白，看起来像四个空格子。现在：一行字 + 一行副标（里面有多少），
   去掉竖分隔线，只用一条贯通细线压住整组，视觉重量轻一半，信息量反而多。 */
.masthead__rule{height:1.5px;background:var(--ink);margin:0 0 0;flex:0 0 auto}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);height:42px;flex:0 0 auto}
.tabbar button{
  -webkit-appearance:none;appearance:none;background:transparent;border:0;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink);
  cursor:pointer;white-space:nowrap;padding:0 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:color 250ms var(--ease-out);
}
.tabbar button em{
  font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  color:var(--ink-62);line-height:1;
}
/* 当前页的那一格：朱砂下划线 + 主色，其余保持墨色 */
.tabbar button[aria-current="page"]{box-shadow:inset 0 -2.5px 0 var(--red)}
.tabbar button:hover{color:var(--red)}
.tabbar button:active{color:var(--red)}
/* ---------- 墙 ---------- */
.board{position:absolute;left:0;right:0;top:126px;bottom:58px;z-index:10;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.board::-webkit-scrollbar{width:0;height:0;display:none}
.wall{position:relative;background:var(--paper-hi)}

.tile{
  -webkit-appearance:none;appearance:none;position:absolute;left:0;top:0;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;
  padding:12px 11px 13px;margin:0;border:0;overflow:hidden;text-align:left;cursor:pointer;
  font-family:var(--serif);color:var(--ink);transition:filter 250ms var(--ease-out),opacity 250ms var(--ease-out);
  -webkit-tap-highlight-color:transparent;will-change:transform;
}
.tile--in{animation:tileIn 250ms var(--ease) both}
@keyframes tileIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.tile:active{filter:brightness(.94)}
.tile:focus-visible{outline:0.5px solid var(--red);outline-offset:-3px}
.c-ink:focus-visible,.c-red:focus-visible{outline-color:var(--on-accent)}
.c-paper{background:var(--paper);outline:0.5px solid var(--border-subtle);outline-offset:-0.5px}
.c-fade{background:var(--paper-2);outline:0.5px solid var(--border-strong);outline-offset:-0.5px}
/* 红块 = 实心朱红（#8c3a2e，用户指定的旧版印章红，全站唯一红）+ on-accent 浅字：7.3:1；
   块上 12px 小字继承浅色（带 opacity 压低），与旧版一致。
   墨块是中性深色，不抢强调色。 */
.c-ink{background:var(--ink);color:var(--paper)}
.c-red{background:var(--red);color:var(--on-accent)}

/* ================================================================
   评分色阶（全局唯一一处，四处消费：墙 / 详情 / 店页 / 吃什么卡片）
   色阶直接复用首页墙已有的四色，不另发明一套：
     1–2 分 → 墨 · 3 分 → 深纸灰 · 4 分 → 墨（= 纸色在浅底上的等价实心）· 5 分 → 朱砂
   规则：只有满分才给朱砂（唯一强调色）；分数越低越沉；
         未评分（data-r="0"）→ 空心灰点，不占色。
   深底（墨 / 朱红块）必须翻色，否则同色相糊：
     1-2 分墨点糊进墨底 → 翻纸；5 分朱红点在朱红块上直接消失 → 都翻纸（朱红偏深，翻墨只有 2.2:1）；
     3 分灰翻浅灰；4 分墨点翻纸点。
   ================================================================ */
.marks{display:inline-flex;gap:3px;vertical-align:middle}
.marks i{display:block;width:5px;height:5px;border:0.5px solid var(--ink-40);box-sizing:border-box}
.marks i.on{background:var(--ink-40);border-color:transparent}
.marks[data-r="1"] i.on,.marks[data-r="2"] i.on{background:var(--r-low);border-color:transparent}
.marks[data-r="3"] i.on{background:var(--r-mid);border-color:transparent}
.marks[data-r="4"] i.on{background:var(--r-low);border-color:transparent}
.marks[data-r="5"] i.on{background:var(--r-high);border-color:transparent}
/* 未评分：即便有 .on 也保持空心，不占色（见色阶注释） */
.marks[data-r="0"] i.on{background:transparent;border-color:var(--ink-40)}
/* 深底翻色：Radix 的"反相阶"——墨底（ink）上的 12 步字用 1 步纸色。 */
.c-ink .marks[data-r="4"] i.on{background:var(--paper);border-color:var(--paper);box-shadow:none}
.c-ink .marks[data-r="3"] i.on{background:var(--paper-3);border-color:transparent}
.c-ink .marks[data-r="1"] i.on,
.c-ink .marks[data-r="2"] i.on{background:var(--paper);border-color:transparent}
.c-ink .marks[data-r="5"] i.on{background:var(--paper);border-color:transparent}
/* 朱红实心底同理翻色（见色阶注释）：1-2/4/5 分翻纸 · 3 分翻浅灰 · 0 分空心翻纸 */
.c-red .marks[data-r="4"] i.on{background:var(--paper);border-color:var(--paper);box-shadow:none}
.c-red .marks[data-r="3"] i.on{background:var(--paper-3);border-color:transparent}
.c-red .marks[data-r="1"] i.on,
.c-red .marks[data-r="2"] i.on{background:var(--paper);border-color:transparent}
.c-red .marks[data-r="5"] i.on{background:var(--paper);border-color:transparent}
.c-red .marks[data-r="0"] i.on{background:transparent;border-color:var(--paper)}

.tile__ghost{position:absolute;right:-5px;bottom:-12px;z-index:0;font-family:var(--serif);font-weight:700;font-size:96px;line-height:.72;opacity:.085;pointer-events:none}
.c-ink .tile__ghost,.c-red .tile__ghost{opacity:.11}
.c-fade .tile__ghost{opacity:.1}
.tile__hatch{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.05;background-image:repeating-linear-gradient(45deg,currentColor 0 .5px,transparent .5px 7px)}
.tile__no{position:absolute;top:9px;left:10px;z-index:2;font-family:var(--mono);font-size:12px;line-height:1;letter-spacing:.1em;opacity:.42}
.tile__rate{position:absolute;top:9px;right:10px;z-index:2;display:flex;gap:2px}
.tile__rate .marks{gap:2px}
.tile__rate .marks i{width:4px;height:4px}
.t-hero .tile__rate{top:13px;right:14px}
.t-hero .tile__rate .marks{gap:2.5px}
.t-hero .tile__rate .marks i{width:5px;height:5px}
.t-tall .tile__rate{top:8px;right:10px}
.t-small .tile__rate{top:8px;right:9px}
.t-small .tile__rate .marks{gap:1.5px}
.t-small .tile__rate .marks i{width:3.5px;height:3.5px}
.tile__name{position:relative;z-index:2;font-size:var(--fs,28px);line-height:1.04;font-weight:600;letter-spacing:.01em;max-width:100%}
.tile__meta{position:relative;z-index:2;max-width:100%;font-family:var(--sans);font-size:12px;line-height:1.35;letter-spacing:.01em;opacity:.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.t-hero{padding:15px 14px 15px}
.t-hero .tile__name{line-height:1.02;letter-spacing:.005em}
.t-hero .tile__no{top:13px;left:14px;font-size:12px}
.t-hero .tile__meta{font-size:12px;opacity:.68;padding-top:8px;margin-top:2px;border-top:0.5px solid var(--on-ink-subtle)}
.c-paper.t-hero .tile__meta,.c-fade.t-hero .tile__meta{border-top-color:var(--border-subtle)}
/* 红块实心，分隔线走默认的浅色线（同墨块） */
.t-wide{padding:12px 12px 13px}
.t-wide .tile__name{line-height:1.06}
.t-tall{padding:12px 11px 13px;justify-content:space-between;align-items:flex-start}
.t-tall .tile__name{writing-mode:vertical-rl;text-orientation:upright;align-self:flex-end;letter-spacing:.12em;line-height:1;max-height:100%;max-width:none;margin-top:13px}
.t-tall .tile__ghost{right:auto;left:-9px;bottom:-12px;writing-mode:vertical-rl;text-orientation:upright;font-size:64px;line-height:1}
.t-tall .tile__no{top:9px;left:10px}
.t-tall .tile__meta{font-size:12px;max-width:calc(100% - 4px);-webkit-line-clamp:2}
.t-small{padding:9px 9px 10px;gap:3px}
.t-small .tile__no{top:8px;left:9px;font-size:12px;letter-spacing:.06em}
.t-small .tile__rate{top:8px;right:9px}
.t-small .tile__rate i{width:3.5px;height:3.5px}
.t-small .tile__name{line-height:1.1}
.t-small .tile__meta{font-size:12px;line-height:1.32}
.t-small .tile__ghost{opacity:.1}

/* 空态 */
.empty{padding:70px 26px 40px;text-align:center;display:none;flex-direction:column;align-items:center;gap:16px}
.empty.on{display:flex}
.empty__mark{width:44px;height:44px;border:0.5px dashed var(--ink-62);position:relative}
.empty__mark::before{content:"";position:absolute;inset:11px;border:0.5px solid var(--border-subtle)}
.empty__t{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--ink-70)}
.empty__b{margin-top:4px;height:42px;padding:0 18px;background:var(--ink);color:var(--paper);border:0;font-family:var(--serif);font-size:15px;letter-spacing:.14em;cursor:pointer}

/* 接续提示 */
.feed{height:66px;display:flex;align-items:center;justify-content:center;gap:9px;opacity:0;transition:opacity 250ms var(--ease-out)}
.feed.on{opacity:1}
.feed__bar{display:block;width:26px;height:1px;background:var(--border-strong)}
.feed__t{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--ink-62);white-space:nowrap}

/* 底部印脚。原来两行小字（7px/8px）—— 规则 8 要求最小 12px，
   两行 12px 在 58px 里放不下，所以压成一行，把"演示数据"说明留在末尾。
   规则 2：不再重复"墙上 N 笔"（报头已有），只留数据来源这一条必要信息。 */
.counter{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:50;background:var(--paper);border-top:0.5px solid var(--ink);display:flex;align-items:center;padding:0 0 0 16px}
.imprint{display:flex;flex-direction:column;gap:3px;line-height:1.2;min-width:0}
.imprint__l1{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imprint__l1 b{font-weight:400;color:var(--text)}
.imprint__l2{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{
  -webkit-appearance:none;appearance:none;position:absolute;right:14px;bottom:18px;z-index:55;
  height:44px;padding:0 16px 0 17px;display:flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--paper);border:0;cursor:pointer;
  font-family:var(--serif);font-size:15px;letter-spacing:.12em;
  box-shadow:0 0 0 5px var(--paper),3px 4px 0 var(--border-subtle);transition:transform 250ms var(--ease-out);
}
.fab:active{transform:scale(.975)}
.fab i{display:block;width:6px;height:6px;background:var(--red);font-style:normal;flex:0 0 auto}

.home-ind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink-62);z-index:93;pointer-events:none}

/* ---------- 回到最新 ---------- */
.toLatest{
  -webkit-appearance:none;appearance:none;position:absolute;right:12px;top:134px;z-index:62;
  height:30px;padding:0 10px;display:flex;align-items:center;gap:6px;
  background:var(--paper);border:0.5px solid var(--ink);color:var(--ink);cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  box-shadow:2px 2px 0 var(--border-subtle);
  transform:translateY(-5px);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out),visibility 250ms 250ms;
}
.toLatest.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out),visibility 250ms 250ms}

/* ---------- 遮罩 / 排序面板 ---------- */
.scrim{position:absolute;inset:0;z-index:68;background:var(--border-strong);opacity:0;visibility:hidden;transition:opacity 250ms var(--ease-out),visibility 250ms 250ms}
.scrim.on{opacity:1;visibility:visible;transition:opacity 250ms var(--ease-out),visibility 250ms 250ms}

/* ---------- 页面（足迹 / 城市 / 店） ---------- */
.pager{position:absolute;inset:0;z-index:60;pointer-events:none}
.page{
  position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;
  padding-top:52px;pointer-events:auto;transform:translateX(100%);
  transition:transform 250ms var(--ease-out);will-change:transform;
  box-shadow:-12px 0 30px var(--border-subtle);
}
.page.in{transform:none}
/* 退场中的页立刻让出点击：420ms 动画期间，下面的列表马上可以继续点 */
.page:not(.in){pointer-events:none}
.page__bar{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 14px 0 4px;border-bottom:0.5px solid var(--ink)}
.pback{
  -webkit-appearance:none;appearance:none;width:42px;height:40px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;cursor:pointer;color:var(--ink);font-size:15px;line-height:1;
}
.pback:hover{background:var(--surface-hover)}
.page__title{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page__meta{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-40);white-space:nowrap;padding-left:8px}
.page__body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.page__body::-webkit-scrollbar{width:0;height:0;display:none}

/* 城市行 */
.city-row{
  -webkit-appearance:none;appearance:none;display:flex;flex-direction:column;gap:5px;width:100%;
  padding:15px 18px 14px;background:transparent;border:0;border-bottom:0.5px solid var(--ink-16);
  text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans);
}
.city-row:hover{background:var(--surface-hover)}
.city-row__top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.city-row__name{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.03em;line-height:1}
.city-row__num{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-55);white-space:nowrap}
.city-row__sub{font-size:12px;line-height:1.5;color:var(--ink-40)}
.city-row__sub b{font-weight:400;color:var(--text-muted)}
.city-row__chev{color:var(--ink-40);font-size:12px;margin-left:2px}

/* 足迹 = 通讯录式索引：按拼音首字母分组，右侧一条字母轨。
   改之前是一条平铺列表，城市一多就只能翻；现在点字母直接跳组。
   轨挂在 .page 下（不是 .page__body 里），否则会跟着内容滚走。 */
.city-groups{padding-bottom:26px}
.city-group__h{
  position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:8px;
  padding:8px 30px 7px 18px;background:var(--paper-2);
  border-bottom:0.5px solid var(--ink-16);
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--ink);
}
.city-group__h b{font-family:var(--serif);font-size:15px;letter-spacing:.02em}
.city-group__h i{font-style:normal;color:var(--ink-55);letter-spacing:.08em;font-size:12px}
.city-rail{
  position:absolute;top:52px;right:2px;bottom:8px;width:26px;z-index:5;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
  padding:2px 0;
}
.city-rail b{
  flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-55);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.city-rail b:hover{color:var(--red)}
.city-rail b.on{color:var(--paper);background:var(--ink)}
/* 点字母时的浮标提示，像通讯录那样 */
.city-rail__tip{
  position:absolute;right:26px;top:50%;transform:translateY(-50%);
  min-width:34px;height:34px;padding:0 8px;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:30px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity 250ms var(--ease-out);
}
.city-rail__tip.on{opacity:1}
/* 分组行比原来紧凑：一屏能看 6~7 座城，翻得更少 */
.city-groups .city-row{padding:13px 30px 12px 18px}

/* 店页 */
.shop-head{padding:18px 18px 14px;border-bottom:0.5px solid var(--ink)}
.shop-head__name{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;letter-spacing:.01em;margin:0}
.shop-head__sub{margin:8px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-40)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:0.5px solid var(--ink)}
.stat{padding:14px 0 13px 18px;border-right:0.5px solid var(--ink-16)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.stat span{display:block;margin-top:7px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-40)}
.dish-row{
  -webkit-appearance:none;appearance:none;width:100%;display:flex;align-items:center;gap:10px;
  padding:13px 18px;background:transparent;border:0;border-bottom:0.5px solid var(--ink-16);
  text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans);
}
.dish-row:hover{background:var(--surface-hover)}
.dish-row__name{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.01em}
.dish-row__shop{font-size:12px;color:var(--ink-40)}
.dish-row__date{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-40)}
/* 店页 / 卡片 / 详情的评分点：形状沿用各自尺寸，颜色统一走上面的 .marks 色阶 */
.dish-row__stars{display:inline-flex;gap:2px;vertical-align:middle}
.dish-row__stars i{width:4px;height:4px}
.page-foot{padding:14px 18px 30px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-40)}
.clist{border-top:0.5px solid var(--ink);margin-top:8px}
.clist__h{padding:12px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-40)}
.footnote{padding:18px 18px 26px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-62)}
.page-empty{padding:60px 26px;text-align:center;font-family:var(--serif);font-size:15px;line-height:1.8;color:var(--ink-40)}

/* ---------- 排行榜（F3 的菜谱语言：纸白、双细线、章节号、点线引导） ---------- */
.rank{padding:2px 18px 26px}
.rank__sec{padding-top:15px}
.rank__head{display:flex;align-items:baseline;gap:9px;padding-bottom:6px;border-bottom:0.5px solid var(--ink-16)}
.rank__no{font-family:var(--serif);font-size:15px;line-height:1;color:var(--red);letter-spacing:.02em}
.rank__t{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.06em}
.rank__n{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-40)}
.rank__row{
  -webkit-appearance:none;appearance:none;width:100%;display:flex;align-items:baseline;gap:8px;
  padding:7px 0 6px;background:transparent;border:0;cursor:pointer;text-align:left;
  color:var(--ink);font-family:var(--sans);
}
.rank__row:hover{background:var(--surface-hover)}
.rank__name{font-size:12px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.rank__dots{flex:1;min-width:12px;border-bottom:0.5px dotted var(--ink-62);transform:translateY(-3px)}
.rank__v{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-55);white-space:nowrap}
.rank__v em{font-style:normal;font-size:12px;color:var(--ink-40);margin-left:1px}
.rank__empty{padding:9px 0 4px;font-size:12px;line-height:1.6;color:var(--ink-40)}
/* 「只列前 5 家，另有 26 家」——克制的一行，交代截断而不是静默吞掉 */
.rank__more{padding:9px 0 2px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-62)}
.rank__hint{padding:24px 18px 30px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--ink-62)}

/* ---------- 吃什么：转盘（圆心在屏幕外下方，卡片绕它摆动） ---------- */
.today{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:8px}
.today__idx{flex:0 0 auto;height:34px;display:flex;align-items:center;justify-content:center;gap:1px}
.today__idx button{
  -webkit-appearance:none;appearance:none;width:26px;height:34px;padding:0;border:0;
  background:transparent;cursor:pointer;display:grid;place-items:center;
}
/* 真正的竖条画在按钮的伪元素上：命中区 22×32（过 24×24 的 AA 线），
   视觉仍是 3px 细条 —— 用大按钮套小图形，而不是把图形本身撑大。 */
.today__idx button::before{
  content:"";display:block;width:3px;height:11px;background:var(--border-strong);
  transition:height 250ms var(--ease-out),background 250ms var(--ease-out);
}
.today__idx button.on::before{background:var(--red);height:17px}
/* 转盘舞台：圆心在舞台下方屏幕外，卡片排在它的弧线上，切换时整排一起摆过来 */
.today__wheel{
  flex:1;min-height:0;position:relative;overflow:hidden;
  perspective:1100px;
  touch-action:pan-y;
}
/* 卡片：JS 直接算好弧上坐标（translate + scale + rotate 一点点倾斜），
   不靠 rotate 绕外圆心凑位移 —— 那会让卡片往一侧偏、摆不出居中对称的弧。 */
.today__wheel .card{
  position:absolute;left:50%;top:50%;width:84%;height:420px;max-height:100%;
  background:var(--card);border:0.5px solid var(--border-subtle);border-radius:6px;
  padding:20px 20px 18px 26px;display:flex;flex-direction:column;
  box-shadow:0 10px 22px var(--surface-hover);
  backface-visibility:hidden;
  transition:transform 250ms var(--ease-out),opacity 250ms var(--ease-out);
  will-change:transform,opacity;
}
/* 拖拽 / 转圈时关掉过渡，跟手（否则 CSS 过渡会把每帧的 JS 插值再平滑一遍，
   观感就是"抽风"：位置来回晃、落位还多晃半拍） */
.today__wheel.drag .card,
.today__wheel.spin .card{transition:none}
/* 弧线上的深浅：正面最实，往两边渐淡；摆过 ±60° 淡出，避免叠在一起发糊 */
.today__wheel .card.is-mid{opacity:.5}
.today__wheel .card.is-off{opacity:0;pointer-events:none}
.card > *{position:relative;z-index:1}
.card__ghost{position:absolute;right:-4px;bottom:26px;z-index:0;font-family:var(--serif);font-weight:700;font-size:168px;line-height:.8;color:var(--ink);opacity:.05;pointer-events:none}


.today__wheel .card.today{box-shadow:0 0 0 1.5px var(--red),0 10px 22px var(--surface-hover)}
.card__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card__no{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-40)}
/* 「就吃这个」的章 = 一枚真盖在卡上的方章：白文（朱红底、纸色字）、竖排「今天」、
   轻微倾斜 + multiply 让红像吃进纸里；边缘内 4px 一圈纸色细线是印章的"双边"。
   盖下瞬间有个 scale 弹跳（sealIn），像"啪"地落章。 */
.card__today{
  display:none;
  position:absolute;right:14px;top:12px;z-index:5;
  width:58px;height:58px;box-sizing:border-box;
  background:
    radial-gradient(ellipse at 66% 24%, rgba(255,255,255,.14), transparent 58%),   /* 印泥不匀 */
    var(--red);
  color:var(--paper);
  font-family:var(--serif);font-weight:700;font-size:15px;line-height:1;
  writing-mode:vertical-rl;                    /* 竖排两字，读作「今天」 */
  letter-spacing:.04em;
  outline:0.5px solid var(--on-ink-strong);   /* 双边：红面里再切一圈纸线 */
  outline-offset:-4px;
  transform:rotate(-9deg);
  mix-blend-mode:multiply;
  opacity:.94;
}
.card.today .card__today{
  display:flex;align-items:center;justify-content:center;
  animation:sealIn 250ms cubic-bezier(.2,.85,.3,1.2) both;
}
@keyframes sealIn{
  from{opacity:0;transform:rotate(-26deg) scale(1.9)}
  to{opacity:.94;transform:rotate(-9deg) scale(1)}
}
.card__name{font-family:var(--serif);font-size:48px;line-height:1.08;font-weight:600;margin:20px 0 0;letter-spacing:.01em}
.card__shop{margin:10px 0 0;font-size:12px;line-height:1.6;color:var(--ink-55)}
.card__rate{display:flex;align-items:center;gap:7px;margin-top:14px}
.card__rate .marks{gap:3px}
.card__rate .marks i{width:5px;height:5px}
.card__rate b{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.08em;color:var(--ink-55)}
.card__note{
  flex:1;min-height:0;margin:16px 0 0;overflow:hidden;
  font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--ink-70);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;
}
.card__note.is-empty{color:var(--ink-40)}
.card__why{
  margin-top:12px;padding-top:10px;border-top:0.5px solid var(--border-subtle);
  font-family:var(--mono);font-size:12px;line-height:1.5;letter-spacing:.05em;color:var(--ink-55);
}
.card__why b{font-weight:400;color:var(--red)}
.today__foot{flex:0 0 auto;display:flex;gap:10px;padding:12px 18px 18px;border-top:0.5px solid var(--ink)}
/* "今天从 N 个候选里抽了 10 个" —— 随机这件事要说出来，否则用户以为看的是全部 */
.today__draw{
  flex:0 0 auto;padding:8px 18px 0;text-align:center;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-55);
}
.today__foot button{
  -webkit-appearance:none;appearance:none;flex:1;height:46px;
  border:0.5px solid var(--ink);background:transparent;color:var(--ink);
  font-family:var(--serif);font-size:15px;letter-spacing:.16em;cursor:pointer;
  transition:background 250ms var(--ease-out),color 250ms var(--ease-out);
}
.today__foot button:hover{background:var(--surface-hover)}
.today__foot .pick{background:var(--ink);color:var(--paper)}
.today__foot .pick:hover{background:var(--ink-hover)}
.today-empty{padding:70px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.today-empty p{font-family:var(--serif);font-size:15px;line-height:1.8;color:var(--ink-70);margin:0}

/* ---------- 搜索层 ---------- */
.search{
  position:absolute;inset:0;z-index:64;background:var(--paper);display:flex;flex-direction:column;
  padding-top:52px;transform:translateY(-101%);visibility:hidden;
  transition:transform 250ms var(--ease-out),visibility 250ms 250ms;
}
.search.in{transform:none;visibility:visible;transition:transform 250ms var(--ease-out),visibility 250ms 250ms}
.sbar{height:54px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 12px 0 4px;border-bottom:0.5px solid var(--ink)}
.sinput{
  flex:1;min-width:0;border:0;background:transparent;outline:none;padding:8px 2px;
  font-family:var(--serif);font-size:30px;color:var(--ink);
}
.sinput::placeholder{color:var(--ink-55)}
.sinput::-webkit-search-cancel-button,.sinput::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sclear{
  -webkit-appearance:none;appearance:none;width:38px;height:38px;border:0;background:transparent;
  color:var(--ink);font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.sbar__x{font-family:var(--sans)}
.shits{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px;border-bottom:0.5px solid var(--ink-16);min-height:34px}
.shits__t{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-40)}
.shits__c{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-40);display:none;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sboard{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sboard::-webkit-scrollbar{width:0;height:0;display:none}
.sempty{padding:54px 26px;text-align:center}
.sempty__t{font-family:var(--serif);font-size:15px;line-height:1.8;color:var(--ink-70);margin:0}
.sempty__s{margin:10px 0 0;font-size:12px;line-height:1.7;color:var(--ink-40)}
.sempty__b{margin-top:18px;height:38px;padding:0 16px;border:0.5px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--serif);font-size:15px;letter-spacing:.1em;cursor:pointer}
.sug{padding:20px 18px}
.sug__h{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-40);margin:0 0 10px}
.sug__list{display:flex;flex-wrap:wrap;gap:7px}
.sug__b{border:0.5px solid var(--ink-16);background:transparent;color:var(--ink-72);font-family:var(--serif);font-size:12px;padding:6px 10px;cursor:pointer}
.sug__b:hover{background:var(--surface-hover)}

/* ---------- 详情层 ---------- */
.detail{
  position:absolute;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column;
  padding-top:52px;transform:translateY(100%);visibility:hidden;outline:none;
  transition:transform 250ms var(--ease-out),visibility 250ms 250ms;will-change:transform;
}
.detail.in{transform:none;visibility:visible;transition:transform 250ms var(--ease-out),visibility 250ms 250ms}
.dbar{height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 4px}
.dback{-webkit-appearance:none;appearance:none;display:flex;align-items:center;gap:7px;height:40px;padding:0 10px;background:transparent;border:0;cursor:pointer;color:var(--ink);font-family:var(--sans);font-size:12px;letter-spacing:.06em}
.dback em{font-style:normal;font-size:15px;line-height:1;transform:translateY(-.5px)}
.dback:hover{background:var(--surface-hover)}
.dcount{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-40)}

.dplate{position:relative;flex:0 0 auto;height:268px;overflow:hidden;background:var(--paper-2);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 22px}
.dplate[data-tone="ink"]{background:var(--ink);color:var(--paper)}
.dplate[data-tone="red"]{background:var(--red);color:var(--on-accent)}
.dplate__ghost{position:absolute;right:-8px;top:4px;z-index:0;font-family:var(--serif);font-weight:700;font-size:236px;line-height:.78;opacity:.12;pointer-events:none}
.dplate[data-tone="ink"] .dplate__ghost,.dplate[data-tone="red"] .dplate__ghost{opacity:.1}
.dplate::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.06;background-image:repeating-linear-gradient(45deg,currentColor 0 .5px,transparent .5px 8px)}
.dplate__no{position:absolute;top:15px;left:22px;z-index:2;font-family:var(--mono);font-size:12px;letter-spacing:.18em;opacity:.55}
.dplate__rate{position:absolute;top:14px;right:22px;z-index:2;display:flex}
.dplate__rate .marks{gap:4px}
.dplate__rate .marks i{width:5px;height:5px}
.dname{position:relative;z-index:2;margin:0;font-family:var(--serif);font-size:48px;line-height:1.02;font-weight:600;letter-spacing:.005em}
.dshop{position:relative;z-index:2;margin:11px 0 0;font-size:12px;line-height:1.6;opacity:.72}

.dbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:16px 22px 18px}
.dbody::-webkit-scrollbar{width:0;height:0;display:none}
.dmeta{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ddate{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-55)}
.dstars{display:flex;align-items:center;gap:8px}
.dstars .marks{gap:3.5px}
.dstars .marks i{width:9px;height:9px}
.dstars b{font-family:var(--mono);font-size:12px;letter-spacing:.08em;font-weight:400;color:var(--ink-55)}
.drule{height:1px;background:var(--ink-16);margin:14px 0 0}
.dnote-wrap{position:relative;margin-top:0}
.dnote-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0 30px,var(--border-subtle) 30px 31px);-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 72%,transparent 100%)}
.dnote{position:relative;margin:0;padding-top:10px;min-height:52px;font-family:var(--serif);font-size:15px;line-height:31px;letter-spacing:.01em;text-indent:2em;text-wrap:pretty}
.dnote.is-empty{text-indent:0;opacity:.5}
.dphoto{
  margin-top:14px;height:62px;border:0.5px dashed var(--border-strong);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  background-image:repeating-linear-gradient(45deg,var(--surface-hover) 0 1px,transparent 1px 7px);
}
.dphoto span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-40)}
.dphoto em{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--border-strong)}

.drel{margin-top:18px;border-top:0.5px solid var(--ink-16);padding-top:4px}
.drel__h{
  -webkit-appearance:none;appearance:none;width:100%;display:flex;align-items:baseline;gap:8px;
  padding:9px 0 7px;background:transparent;border:0;cursor:pointer;color:var(--ink);text-align:left;font-family:var(--sans);
}
.drel__h .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-40);flex:0 0 auto}
.drel__h .v{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drel__h .n{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-40);flex:0 0 auto}
.drel__h .c{margin-left:auto;font-size:12px;color:var(--ink-40);flex:0 0 auto;padding-left:6px}
.drel__list{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 6px}
.drel__chip{
  -webkit-appearance:none;appearance:none;border:0.5px solid var(--ink-16);background:transparent;color:var(--ink);
  font-family:var(--serif);font-size:12px;padding:5px 9px;cursor:pointer;
}
.drel__chip:hover{background:var(--surface-hover)}
.drel__none{font-size:12px;color:var(--ink-40);padding:0 0 8px}

.dact{flex:0 0 auto;display:flex;gap:10px;padding:10px 18px 16px;border-top:0.5px solid var(--ink);background:var(--paper)}
.dact button{flex:1;height:44px;border:0.5px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--serif);font-size:15px;letter-spacing:.16em;cursor:pointer;transition:background 250ms var(--ease-out),color 250ms var(--ease-out)}
.dact button:hover{background:var(--surface-hover)}
.dact .danger{color:var(--red);border-color:var(--red)}
.dact .danger:hover{background:rgba(140,58,46,.06)}

/* ---------- 表单（贴一张 / 编辑） ---------- */
.form{
  position:absolute;inset:0;z-index:85;background:var(--paper);display:flex;flex-direction:column;
  padding-top:52px;transform:translateY(101%);visibility:hidden;
  transition:transform 250ms var(--ease-out),visibility 250ms 250ms;
}
.form.in{transform:none;visibility:visible;transition:transform 250ms var(--ease-out),visibility 250ms 250ms}
.fbar{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px 0 4px;border-bottom:0.5px solid var(--ink)}
.fbar h2{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.04em;margin:0}
.fbar span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-40)}
.fbar .grow{flex:1}
.fbody{flex:1;min-height:0;overflow-y:auto;padding:12px 20px 6px;scrollbar-width:none}
.fbody::-webkit-scrollbar{width:0;height:0;display:none}
.fsubmit{flex:0 0 auto;padding:10px 20px 22px;border-top:0.5px solid var(--ink-16)}

.photo{position:relative;height:62px;margin-bottom:14px;border:0.5px dashed var(--ink-62);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background-image:repeating-linear-gradient(45deg,var(--surface-hover) 0 1px,transparent 1px 7px)}
.photo__l{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-40)}
.photo__l i{display:block;width:7px;height:7px;border:0.5px solid currentColor}
.photo__r{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--border-strong)}

.field{display:block;margin:0 0 11px;position:relative}
.flabel{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-40);margin-bottom:2px}
.flabel i{font-style:normal;color:var(--red);letter-spacing:.08em}
.field input,.field textarea{
  display:block;width:100%;border:0;border-bottom:0.5px solid var(--border-strong);
  background:transparent;border-radius:0;padding:6px 0 8px;font-family:var(--serif);font-size:30px;color:var(--ink);
  -webkit-appearance:none;appearance:none;
}
/* 焦点环只在键盘导航时出现（:focus-visible）。原来的 outline:none 会连焦点环一起吃光，
   键盘用户看不见自己在哪个输入框 —— 这是 2.4.7 的失败。 */
.field input:focus-visible,.field textarea:focus-visible{
  outline:0.5px solid var(--red);outline-offset:3px;border-bottom-color:var(--ink);
}
.field textarea{font-size:15px;line-height:1.7;resize:none;min-height:56px;border-bottom-color:var(--border-strong)}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-55)}
.field input:focus,.field textarea:focus{border-bottom-color:var(--ink)}
/* iOS Safari 会缩放 <16px 输入框所在的整页，这里把日期选择器也抬到 16px */
.field input[type="datetime-local"]{font-family:var(--mono);font-size:15px;letter-spacing:.02em;padding:9px 0}
.field.bad input{border-bottom-color:var(--red)}
.field.bad .flabel{color:rgba(140,58,46,.8)}
.ferr{display:none;margin-top:7px;font-family:var(--sans);font-size:12px;Color:var(--red)}
.field.bad .ferr{display:block}
.field.bad{animation:shake 250ms ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}

/* 表单里的评分选择器：是可点的控件（不是展示），但填充色沿用同一套色阶，
   点到的分数长什么样，存进去之后就长什么样。 */
.stars{display:flex;align-items:center;gap:8px;margin-top:4px}
.star{-webkit-appearance:none;appearance:none;width:34px;height:36px;padding:0;background:transparent;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.star i{display:block;width:24px;height:24px;border:0.5px solid var(--ink-62);transition:background 250ms var(--ease-out),border-color 250ms var(--ease-out)}
.stars[data-pick="1"] .star.on i,.stars[data-pick="2"] .star.on i{background:var(--r-low);border-color:var(--r-low)}
.stars[data-pick="3"] .star.on i{background:var(--r-mid);border-color:var(--r-mid)}
.stars[data-pick="4"] .star.on i{background:var(--paper);border-color:var(--ink)}
.stars[data-pick="5"] .star.on i{background:var(--r-high);border-color:var(--r-high)}
.stars__label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-40);margin-left:2px}

.suggest{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.suggest:empty{display:none}
.sg{-webkit-appearance:none;appearance:none;border:0.5px solid var(--ink-16);background:transparent;color:var(--text-muted);font-family:var(--sans);font-size:12px;padding:4px 8px;cursor:pointer}
.sg:hover{background:var(--surface-hover)}
.sg:disabled{opacity:.4;cursor:default}

.submit{width:100%;height:52px;background:var(--ink);color:var(--paper);border:0;cursor:pointer;font-family:var(--serif);font-size:15px;letter-spacing:.4em;text-indent:.4em;transition:background 250ms var(--ease-out),transform 250ms var(--ease-out)}
.submit:active{background:var(--ink-hover);transform:scale(.995)}

/* ---------- toast ---------- */
.toast{
  position:absolute;left:14px;right:14px;bottom:84px;z-index:88;
  background:var(--ink);color:var(--paper);padding:12px 14px 13px;
  display:flex;align-items:center;gap:12px;overflow:hidden;
  transform:translateY(14px);opacity:0;visibility:hidden;
  transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out),visibility 250ms 250ms;
  box-shadow:4px 5px 0 var(--border-subtle);
}
.toast.on{transform:none;opacity:1;visibility:visible;transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out),visibility 250ms 250ms}
.toast__t{flex:1;font-size:12px;line-height:1.4;letter-spacing:.01em}
.toast__t b{font-family:var(--serif);font-weight:600}
.toast__undo{
  -webkit-appearance:none;appearance:none;flex:0 0 auto;padding:6px 9px;background:transparent;
  border:0.5px solid var(--on-ink-strong);color:var(--paper);font-family:var(--serif);font-size:12px;letter-spacing:.08em;cursor:pointer;
}
.toast__bar{position:absolute;left:0;bottom:0;height:2px;background:var(--red);width:100%;transform-origin:0 50%}
.toast.on .toast__bar{animation:toastbar 5s linear forwards}
@keyframes toastbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* 新贴上的一块 */
.tile.just-added::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border:0.5px solid var(--red);animation:drying 250ms var(--ease) forwards}
@keyframes drying{0%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
