     108 装不下会溢出，所以抬到 124。宽高比仍在 1:1.15 附近，视觉比例不变。 */
  const COL = (390 - 3) / 4, GAP = 1, UNIT = 124;
  const DIM = { hero:{c:2,r:2}, wide:{c:2,r:1}, tall:{c:1,r:2}, small:{c:1,r:1} };

  function makeWall(scroller, wallNode, onScroll) {
    const W = {
      scroller, wallNode, onScroll,
      list: [], entries: [], byId: new Map(), nodes: new Map(), height: 0
    };

    W.layout = function () {
      const queue = W.list.slice();
      const h = [0, 0, 0, 0];
      const out = [];
      let maxUnit = 0;
      for (let i = 0; i < queue.length; i++) {
        const rec = queue[i];
        const d = DIM[rec.span] || DIM.wide;
        let best = null;
        for (let c = 0; c + d.c <= 4; c++) {
          let mx = 0, mn = Infinity;
          for (let k = c; k < c + d.c; k++) { if (h[k] > mx) mx = h[k]; if (h[k] < mn) mn = h[k]; }
          if (mx !== mn) continue;
          if (!best || mx < best.top || (mx === best.top && c < best.c)) best = { c: c, top: mx };
        }
        if (!best) {
          let j = -1;
          for (let k = i + 1; k < Math.min(queue.length, i + 17); k++) {
            if ((DIM[queue[k].span] || DIM.wide).c === 1) { j = k; break; }
          }
          if (j > 0) { const mv = queue.splice(j, 1)[0]; queue.splice(i, 0, mv); i--; continue; }
          let c2 = 0, top2 = Infinity;
          for (let c = 0; c + d.c <= 4; c++) {
            let mx = 0;
            for (let k = c; k < c + d.c; k++) if (h[k] > mx) mx = h[k];
            if (mx < top2) { top2 = mx; c2 = c; }
          }
          best = { c: c2, top: top2 };
        }
        const y = best.top;
        for (let k = best.c; k < best.c + d.c; k++) h[k] = y + d.r;
        if (y + d.r > maxUnit) maxUnit = y + d.r;
        out.push({
          rec: rec,
          x: best.c * (COL + GAP), y: y * (UNIT + GAP),
          w: d.c * COL + (d.c - 1) * GAP, h: d.r * UNIT + (d.r - 1) * GAP
        });
      }
      W.entries = out;
      W.byId = new Map(out.map((e) => [e.rec.id, e]));
      W.height = Math.max(0, maxUnit * (UNIT + GAP) - GAP);
      W.wallNode.style.height = W.height + 'px';
      W.wallNode.__entries = out;
    };

    W.place = function (el, e) {
      el.style.left = e.x.toFixed(2) + 'px';
      el.style.top = e.y.toFixed(2) + 'px';
      el.style.width = e.w.toFixed(2) + 'px';
      el.style.height = e.h.toFixed(2) + 'px';
    };

    W.render = function (animateIn) {
      const st = W.scroller.scrollTop;
      const H = W.scroller.clientHeight || 660;
      const lo = st - H * 1.8, hi = st + H * 2.4;
      const keep = new Set();
      for (let i = 0; i < W.entries.length; i++) {
        const e = W.entries[i];
        if (e.y + e.h > lo && e.y < hi) keep.add(e.rec.id);
      }
      W.nodes.forEach((n, id) => {
        if (!keep.has(id)) { n.el.remove(); W.nodes.delete(id); }
      });
      for (let i = 0; i < W.entries.length; i++) {
        const e = W.entries[i];
        if (!keep.has(e.rec.id)) continue;
        let n = W.nodes.get(e.rec.id);
        if (!n) {
          const el = createTile(e.rec);
          W.place(el, e);
          W.wallNode.appendChild(el);
          W.nodes.set(e.rec.id, { el: el, sig: tileSig(e.rec) });
          if (animateIn) {
            el.classList.add('tile--in');
            setTimeout(() => el.classList.remove('tile--in'), 360);
          }
        } else if (n.sig !== tileSig(e.rec)) {
          /* 这一笔被编辑过：原地换掉节点，否则窗口化渲染会一直显示旧内容 */
          const el = createTile(e.rec);
          W.place(el, e);
          n.el.replaceWith(el);
          W.nodes.set(e.rec.id, { el: el, sig: tileSig(e.rec) });
        } else {
          W.place(n.el, e);
        }
      }
    };

    W.setList = function (list, animateIn) {
      W.list = list;
      W.layout();
      W.render(animateIn);
    };

    W.anchor = function () {
      const st = W.scroller.scrollTop;
      let best = null;
      for (let i = 0; i < W.entries.length; i++) {
        const e = W.entries[i];
        if (e.y + e.h > st + 2 && (!best || e.y < best.y)) best = e;
      }
      return best ? { id: best.rec.id, y: best.y, st: st } : null;
    };
    W.restore = function (a) {
      if (!a) return;
      const e = W.byId.get(a.id);
      if (!e) return;
      W.scroller.scrollTop = Math.max(0, e.y - (a.y - a.st));
    };

    /* 慢慢翻的顺滑点：scroll 事件合并到 rAF 里做窗口渲染，
       同一帧多个 scroll 只 render 一次，不再每个事件都同步跑一遍 */
    let renderQueued = false;
    scroller.addEventListener('scroll', () => {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        W.render(false);
        if (onScroll) onScroll();
      });
    }, { passive: true });

    return W;
  }

  const home = makeWall(board, wallEl, () => {
    updateToLatest();
    if (loading) return;
    if (performance.now() < suppressUntil) return;
    const st = board.scrollTop;
    if (st <= 2 && canNewer()) { loadMore('newer'); return; }
    if (st + board.clientHeight > board.scrollHeight - 420) loadMore('older');
  });

  const searchWall = makeWall(sboard, swall, null);

  /* ================================================================
     7. 双向接续
     ================================================================ */
  let loading = false;
  let suppressUntil = 0;
  const canNewer = () => newerIdx > 0;

  async function loadMore(dir) {
    if (loading) return;
    if (dir === 'newer' && !canNewer()) return;
    loading = true;
    feed.classList.add('on');
    feedText.textContent = dir === 'older' ? '更早的一笔…' : '刚出锅的一笔…';
    await sleep(dir === 'older' ? 380 : 300);
    const a = home.anchor();
    if (dir === 'older') {
      pool = pool.concat(makeOlder(12));
    } else {
      const from = Math.max(0, newerIdx - 12);
      pool = NEWER.slice(from, newerIdx).concat(pool);
      newerIdx = from;
    }
    home.setList(ordered(), dir === 'older');
    home.restore(a);
    updateChrome();
    feed.classList.remove('on');
    loading = false;
    suppressUntil = performance.now() + 260;
  }

  /* ================================================================
     8. 计数 / 回到最新
     ================================================================ */
  function citiesInUse() {
    return new Set(pool.map((r) => r.city).filter(Boolean)).size;
  }
  function updateChrome() {
    wallCount.textContent = pool.length;
    cityCount.textContent = citiesInUse();
    /* 报头那行原来写死「已贴 38 张 · 22 城」，和底部印脚（12 笔 · 7 城）同屏对不上。
       现在跟着同一份数据走：新增/编辑/删除时两处一起变。 */
    if (brandCount) brandCount.textContent = pool.length;
    if (brandCity) brandCity.textContent = citiesInUse();
    homeEmpty.classList.toggle('on', pool.length === 0);
    wallEl.style.display = pool.length ? '' : 'none';
    /* 四个入口的副标是活的：让用户在点之前就知道里面有多少东西 */
    const subCities = $('tabSubCities'), subRank = $('tabSubRank'), subToday = $('tabSubToday'), subSearch = $('tabSubSearch');
    if (subCities) subCities.textContent = citiesInUse() + ' 城';
    if (subSearch) subSearch.textContent = pool.length + ' 笔';
    if (subRank) {
      const five = pool.filter(r => r.rating === 5).length;
      const cnt = {};
      pool.forEach(r => { cnt[r.eat] = (cnt[r.eat] || 0) + 1; });
      const dup = Object.keys(cnt).filter(k => cnt[k] >= 2).length;
      const chapters = [five > 0, dup > 0, citiesInUse() > 0, new Set(pool.map(r => r.shop).filter(Boolean)).size > 0].filter(Boolean).length;
      subRank.textContent = chapters + ' 榜';
    }
    /* 副标跟着真实抽中的张数走：抽 10 个就写 10 张，不够 10 个才退到候选数 */
    if (subToday) subToday.textContent = Math.min(buildDeck().length || pool.length, DECK_N) + ' 张';
  }
  function updateToLatest() {
    const on = board.scrollTop > 260
      && !detail.classList.contains('in') && !form.classList.contains('in')
      && !search.classList.contains('in') && !pages.length;
    toLatest.classList.toggle('on', on);
  }

  /* ================================================================
     9. 排序 —— 已移除
     墙是拼图式的浏览界面：同一堆块换个顺序，用户看不出区别，
     而"按城市"本质上是一次过滤，那件事交给「足迹」和搜索去做。
     state.sort 固定为 time，墙永远"最近的先上墙"。
     ================================================================ */

  /* ================================================================
     11. 页面栈
     ================================================================ */
  let pages = [];
  let pushLock = 0;   /* push 节流：连点只进一次，防动画期叠页 */
  let popLock = 0;    /* pop 节流：连点返回只退一层；不影响 push，退场中仍可立刻点下一行 */

  function pushPage(name, params) {
    const now = performance.now();
    if (now < pushLock) return null;                      /* 连点两下只进一次 */
    const top = pages[pages.length - 1];
    if (top && top.name === name && JSON.stringify(top.params) === JSON.stringify(params)) return top; /* 同页重复 push */
    pushLock = now + 380;                                 /* ≈ 过渡时长 + 余量 */
    const el = document.createElement('section');
    el.className = 'page';
    el.dataset.page = name;
    el.innerHTML = pageHTML(name, params);
    pager.appendChild(el);
    const rec = { name, params, el };
    pages.push(rec);
    bindPage(rec);
    void el.offsetWidth;                                  /* 强制首帧布局后立刻开滑，省掉双 rAF ≈30ms 起步延迟 */
    el.classList.add('in');
    toLatest.classList.remove('on');
    return rec;
  }

  function popPage() {
    const now = performance.now();
    if (now < popLock) return;                            /* 退场动画中连点返回只退一层 */
    popLock = now + 300;
    pushLock = 0;                                         /* 退场即解锁 push：返回后可立刻点下一行 */
    const p = pages.pop();
    if (!p) return;
    p.el.classList.remove('in');                          /* .page:not(.in) 即刻 pointer-events:none */
    setTimeout(() => p.el.remove(), 360);
    if (!pages.length) updateToLatest();
  }

  function replaceTopPage() {
    const p = pages[pages.length - 1];
    if (!p) return;
    p.el.innerHTML = pageHTML(p.name, p.params);
    bindPage(p);
  }

  function pageHTML(name, params) {
    if (name === 'cities') return citiesHTML();
    if (name === 'city') return cityHTML(params.city);
    if (name === 'shop') return shopHTML(params.shop);
    if (name === 'rank') return rankHTML();
    if (name === 'today') return todayHTML();
    return '';
  }

  function bindPage(rec) {
    const el = rec.el;
    el.querySelectorAll('[data-back]').forEach((b) => b.addEventListener('click', popPage));
    el.querySelectorAll('[data-city]').forEach((b) => {
      b.addEventListener('click', () => pushPage('city', { city: b.dataset.city }));
    });
    el.querySelectorAll('[data-shop]').forEach((b) => {
      b.addEventListener('click', () => pushPage('shop', { shop: b.dataset.shop }));
    });
    el.querySelectorAll('[data-open]').forEach((b) => {
      b.addEventListener('click', () => openDetail(b.dataset.open));
    });
    el.querySelectorAll('[data-new]').forEach((b) => {
      b.addEventListener('click', () => openForm(null));
    });
    if (rec.name === 'city') {
      const scroller = el.querySelector('[data-citywall]');
      if (scroller) {
        const list = pool.filter((r) => (r.city || '') === (rec.params.city || '')).sort(SORTS[state.sort]);
        const w = makeWall(scroller, scroller.querySelector('.wall'), null);
        w.setList(list, true);
      }
    }
    if (rec.name === 'cities') bindCitiesIndex(rec);
    if (rec.name === 'today') bindToday(rec);
  }

  /* ================================================================
     11.5 排行榜（借用 F3 的菜谱语言）
     榜单只列前 RANK_TOP 名：榜的意义在"排在前面的那几个"，
     第 11 名往后在"我吃过什么"这种私人数据里没有区分度，
     而且无限列下去会把页面撑成列表（实测 36 笔时店榜已 31 行 / 2.9 屏）。
     章节头仍写「共 N」，超出的部分在章末用一行克制的小字说明，不静默吞掉。
     ================================================================ */
  const RANK_TOP = 5;

  function rankHTML() {
    const five = pool.filter((r) => r.rating === 5).sort((a, b) => b.at.localeCompare(a.at));

    const eatMap = new Map();
    pool.forEach((r) => { if (!eatMap.has(r.eat)) eatMap.set(r.eat, []); eatMap.get(r.eat).push(r); });
    const often = [...eatMap.entries()]
      .filter((e) => e[1].length >= 2)
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh-Hans-CN'));

    /* 城市榜只排"真有城市"的记录。
       没记城市的笔不该参加城市榜 —— 它连城市都没有，排进来是拿一个空值去跟
       成都、乐山比道数，既没有可比性，也占掉一个前 5 的名额。
       这些笔不会丢：还在墙上、搜索里，足迹页也有「未记城市」那一格可以进。 */
    const cityMap = new Map();
    pool.forEach((r) => {
      if (!r.city) return;
      if (!cityMap.has(r.city)) cityMap.set(r.city, []);
      cityMap.get(r.city).push(r);
    });
    const cityRows = [...cityMap.entries()].map((e) => ({
      city: e[0],
      list: e[1],
      avg: e[1].reduce((s, r) => s + r.rating, 0) / e[1].length
    })).sort((a, b) =>
      b.list.length - a.list.length || b.avg - a.avg || a.city.localeCompare(b.city, 'zh-Hans-CN'));

    const shopMap = new Map();
    pool.forEach((r) => {
      if (!r.shop) return;
      if (!shopMap.has(r.shop)) shopMap.set(r.shop, []);
      shopMap.get(r.shop).push(r);
    });
    const shopRows = [...shopMap.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh-Hans-CN'));

    const row = (attr, name, val, unit) =>
      '<button class="rank__row" type="button" ' + attr + '>' +
      '<span class="rank__name">' + esc(name) + '</span><span class="rank__dots"></span>' +
      '<span class="rank__v">' + val + (unit ? '<em>' + unit + '</em>' : '') + '</span></button>';

    /* 取前 RANK_TOP 名；超出的用一行小字交代，而不是静默截断 */
    const top = (arr) => arr.slice(0, RANK_TOP);
    const more = (total, unit) =>
      total > RANK_TOP ? '<div class="rank__more">只列前 ' + RANK_TOP + ' ' + unit + '，另有 ' + (total - RANK_TOP) + ' ' + unit + '</div>' : '';

    const sec = (no, title, count, body) =>
      '<section class="rank__sec"><div class="rank__head"><span class="rank__no">' + no + '</span>' +
      '<span class="rank__t">' + title + '</span><span class="rank__n">' + count + '</span></div>' + body + '</section>';

    const empty = (t) => '<div class="rank__empty">' + t + '</div>';

    return '' +
      '<div class="page__bar"><button class="pback" data-back type="button" aria-label="返回">←</button>' +
      '<span class="page__title">排行榜</span>' +
      '<span class="page__meta">' + pool.length + ' 笔，' + citiesInUse() + ' 城</span></div>' +
      '<div class="page__body"><div class="rank">' +
      sec('壹', '五星榜', five.length + ' 道',
        five.length
          ? top(five).map((r) => row('data-open="' + r.id + '"', r.eat, mmdd(r.at))).join('') + more(five.length, '道')
          : empty('还没有五分的记录。')) +
      sec('贰', '最常吃', often.length + ' 道',
        often.length
          ? top(often).map((e) => {
              const latest = e[1].slice().sort((a, b) => b.at.localeCompare(a.at))[0];
              return row('data-open="' + latest.id + '"', e[0], e[1].length, ' 次');
            }).join('') + more(often.length, '道')
          : empty('同一道菜吃过两次才会进榜。')) +
      sec('叁', '城市榜', cityRows.length + ' 地',
        cityRows.length
          ? top(cityRows).map((e) => row('data-city="' + esc(e.city) + '"', e.city, e.list.length, ' 道')).join('') + more(cityRows.length, '地')
          : empty('还没有记过城市。')) +
      sec('肆', '店榜', shopRows.length + ' 家',
        shopRows.length
          ? top(shopRows).map((e) => row('data-shop="' + esc(e[0]) + '"', e[0], e[1].length, ' 次')).join('') + more(shopRows.length, '家')
          : empty('还没有记过店名。')) +
      '<div class="rank__hint">演示数据：12 条真实记录，其余为程序生成</div>' +
      '</div></div>';
  }

  /* ================================================================
     11.6 吃什么（借用 F2 的卡片语言）
     ================================================================ */
  const todayEaten = new Set();
  const DECK_N = 10;   /* 每天一抽：从候选里随机抽 10 张，抽完当天不再变 */

  /* 当天抽中的 10 张。同一天内重进页面要看到同一批（否则"选"没意义），
     所以用「日期 + 可复现的种子」而不是每次 Math.random()：
     同一天同一个种子 → 同一批；跨天换一天 → 另一批。 */
  const dayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  const daySeed = () => {
    const k = dayKey();
    let h = 2166136261;
    for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  function buildDeck() {
    const byDish = new Map();
    pool.forEach((r) => {
      const cur = byDish.get(r.eat);
      if (!cur || r.at > cur.at) byDish.set(r.eat, r);
    });
    const now = Date.now();
    const cands = [...byDish.values()]
      .filter((r) => !todayEaten.has(r.eat))
      .map((r) => {
        const days = Math.max(0, Math.floor((now - new Date(r.at).getTime()) / 864e5));
        return { rec: r, days: days, weight: r.rating + days };
      })
      .sort((a, b) => b.weight - a.weight || b.rec.at.localeCompare(a.rec.at));

    /* 加权抽 10 个：weight = 评分 + 久未吃天数。
       做法是把权重累成一条"尺子"，在尺子上按种子等距取 10 个点 ——
       既保留"高分 + 很久没吃更容易被抽中"，又天然不重复，且同一天结果稳定。 */
    const n = Math.min(DECK_N, cands.length);
    if (n <= 0) return [];
    const rng = mulberry32(daySeed());
    const total = cands.reduce((s, c) => s + c.weight, 0);
    const out = [];
    const used = new Set();
    /* 等距取点 + 抖动，避免连续两天抽到同一段 */
    for (let i = 0; i < n; i++) {
      const base = total * (i + rng()) / n;
      let acc = 0, pick = cands.length - 1;
      for (let k = 0; k < cands.length; k++) {
        acc += cands[k].weight;
        if (acc >= base) { pick = k; break; }
      }
      if (used.has(pick)) pick = cands.findIndex((_, k) => !used.has(k));
      if (pick < 0) break;
      used.add(pick);
      out.push(cands[pick]);
    }
    /* 抽完仍按权重降序摆：第一张就是今天最该吃的那个 */
    return out.sort((a, b) => b.weight - a.weight || b.rec.at.localeCompare(a.rec.at));
  }

  function todayHTML() {
    const list = buildDeck();
    /* 候选总数可能远大于 10，页面上要说清楚"这是从多少个里抽的 10 个" */
    const candTotal = (() => {
      const byDish = new Map();
      pool.forEach((r) => { const c = byDish.get(r.eat); if (!c || r.at > c.at) byDish.set(r.eat, r); });
      return [...byDish.values()].filter((r) => !todayEaten.has(r.eat)).length;
    })();
    const bar = '<div class="page__bar"><button class="pback" data-back type="button" aria-label="返回">←</button>' +
      '<span class="page__title">吃什么</span>' +
      '<span class="page__meta">' + (list.length ? '第 01 / ' + pad(list.length) : '') + '</span></div>';

    if (!list.length) {
      return bar + '<div class="page__body"><div class="today-empty">' +
        '<span class="empty__mark" aria-hidden="true"></span>' +
        '<p>还没有可推荐的，先贴一张。</p>' +
        '<button class="empty__b" type="button" data-new>贴一张</button>' +
        '</div></div>';
    }

    const cards = list.map((x, i) => {
      const r = x.rec;
      return '<article class="card' + (todayEaten.has(r.eat) ? ' today' : '') + '" data-id="' + r.id + '">' +
        '<span class="card__ghost" aria-hidden="true">' + esc(Array.from(r.eat)[0] || '') + '</span>' +
        '<div class="card__top"><span class="card__no">第 ' + pad(i + 1) + ' / ' + pad(list.length) + '</span></div>' +
        '<h2 class="card__name">' + esc(r.eat) + '</h2>' +
        '<p class="card__shop">' + esc(placeOf(r)) + '</p>' +
        '<div class="card__rate">' + marks(r.rating) +
        '<b>' + (r.rating ? r.rating + ' 分' : '未评') + '</b></div>' +
        '<p class="card__note' + (r.note ? '' : ' is-empty') + '">' + esc(r.note || '没有留下备注。') + '</p>' +
        '<div class="card__why">上次吃是 <b>' + x.days + ' 天前</b>' + (r.city ? '，' + esc(r.city) : '') + '</div>' +
        /* 章放在卡片直接子级的最后：.card>* 给它 z-index:1，DOM 靠后才盖得住菜名 */
        '<span class="card__today">今天</span>' +
        '</article>';
    }).join('');

    const bars = list.map((x, i) =>
      '<button type="button" class="' + (i === 0 ? 'on' : '') + '" data-i="' + i + '" aria-label="第 ' + (i + 1) + ' 张"></button>').join('');

    /* 底部加一行"今天从 N 个候选里抽了 10 个"，让"随机"这件事看得见、说得清 */
    const foot = candTotal > list.length
      ? '<div class="today__draw">' + candTotal + ' 道中抽 ' + list.length + ' 道，今日不变</div>'
      : '';

    return bar +
      '<div class="today">' +
      '<div class="today__idx" id="tIdx">' + bars + '</div>' +
      '<div class="today__wheel" id="tWheel">' + cards + '</div>' +
      foot +
      '<div class="today__foot">' +
      '<button type="button" class="t-next">换 一 张</button>' +
      '<button type="button" class="pick t-pick">就 吃 这 个</button>' +
      '</div></div>';
  }

  /* ================================================================
     11.6b 转盘：圆心在屏幕外下方，卡片排在它的弧线上
     原来是 overflow-x:auto + scroll-snap 的横向轨道（平移）—— 不是转盘。
     现在：圆心固定在舞台底部下方 PIVOT px（屏幕外），卡片圆心排在半径 R 的弧上。
     第 k 张的角度 θ = (k - 当前索引) × STEP，弧上坐标直接算：
       x = sin(θ) × R,  y = (1 - cos(θ)) × R,  缩放 = cos(θ)
     正面 θ=0 → 弧顶正中、最大；往两侧 θ 增大 → 往下沉、往里收、变小，
     正好是转盘边缘"近大远小、沿弧散开"的样子。
     不用 rotate 绕外圆心凑位移：那会让卡片整体偏向一侧，弧不对称。
     ================================================================ */
  /* 弧半径固定；步距在 bindToday 里按 360/n 算 —— 卡片必须正好铺满整圈。
     之前用固定 26°：10 张只铺了 260°，圆环上空着 100° 的缺口；
     转起来缺口转进可视窗时弧上只剩 1~2 张（实测掉到 1 张）——
     就是"看着断掉、绕不回环"的样子。360/n（n=10 → 36°）无缝铺满、左右对称，
     且 period = 360/STEP = n 正好是整数，转圈落位几何完全重合、零跳变。 */
  const WHEEL = { radius: 400 };

  function bindToday(rec) {
    const el = rec.el;
    const wheel = el.querySelector('#tWheel');
    if (!wheel) return;
    const bars = [...el.querySelectorAll('#tIdx button')];
    const cards = [...wheel.querySelectorAll('.card')];
    const meta = el.querySelector('.page__meta');
    const n = cards.length;
    if (!n) return;
    rec.idx = 0;
    const STEP = 360 / n;                /* 铺满整圈：n 步 = 360°，循环无缝 */

    /* 转圈动画的"作废铃"：点索引条 / 键盘 / 拖拽都是新的切换意图，
       bump 令牌让正在跑的 spin() 下一帧立刻让位并清干净状态。
       不这么做的话，动画会反手把用户的点击覆盖掉 —— 看起来就是
       "点了第 6 根条却停在别人身上"（吞点击）。 */
    let spinToken = 0;
    let lastPlaced = 0;                  /* 卡片当前真实摆到的连续位置（转圈中是小数） */
    function takeOver() {
      spinToken++;
      if (next) next._busy = false;
      wheel.classList.remove('spin');
    }

  /* 弧上坐标：θ 相对当前索引。正面那张 θ=0，落在弧顶正中。
     y 用 (1-cosθ)·R 表示"沉下去多少"——圆心在下方，弧顶在圆心正上方，
     所以 θ 越大越往圆心方向（屏幕下方）沉。
     注意 idx 可以是小数（转圈动画用）：θ 连续变化，卡片就是沿弧滑过去的。 */
    function place(idx, dragDeg) {
      const base = dragDeg || 0;
      lastPlaced = idx;                  /* 记住真实位置：拖拽接管转圈时从这里接着摆，零跳变 */
      const R = WHEEL.radius;
      cards.forEach((c, i) => {
        /* θ 允许超过一圈：转圈动画传进来的 idx 是连续小数，
           这里按 (i - idx) 直接算，转过去自然就是沿弧滑到背面再回来。 */
        const th = ((i - idx) * STEP + base) * Math.PI / 180;
        /* 转圈时 θ 会一路涨到 20π 以上：浮点误差会让 sin/cos 抖动（就是"抽风"）。
           每帧先收回到 [-π, π]，三角函数才稳。 */
        const a = Math.atan2(Math.sin(th), Math.cos(th));
        const x = Math.sin(a) * R;
        const y = (1 - Math.cos(a)) * R;
        const s = Math.max(0.35, Math.cos(a));
        /* 越靠边越歪：给一点 rotate 让卡片"贴"在弧的切线上 */
        const tilt = a * 180 / Math.PI * 0.55;
        c.style.transform =
          'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)' +
          ' scale(' + s.toFixed(3) + ') rotate(' + tilt.toFixed(2) + 'deg)';
        /* 淡出窗 ±75°：36° 步距下正好露出正面 + 左右各 2 = 5 张，
           且左右对称（以前 66° 窗配 26° 步距，左半边是 100° 缺口，没有卡） */
        const off = Math.abs(a) > 1.31;
        c.classList.toggle('is-mid', !off && Math.abs(a) > 0.02);
        c.classList.toggle('is-off', off);
        c.style.pointerEvents = off ? 'none' : '';
        /* 层级按角度：正面唯一最高，越靠后越低。
           以前按 |x| 算，正面和背面（θ=180°，x 都 ≈0）会并列 100，层级就乱了 */
        c.style.zIndex = String(100 - Math.round(Math.abs(a) * 180 / Math.PI / 2));
      });
    }

    const sync = () => {
      const i = Math.max(0, Math.min(n - 1, rec.idx));
      rec.idx = i;
      bars.forEach((b, k) => b.classList.toggle('on', k === i));
      if (meta) meta.textContent = '第 ' + pad(i + 1) + ' / ' + pad(n);
      place(i, 0);
    };

    /* ---- 点索引条（转圈中点 = 立即接管，按你点的落） ---- */
    bars.forEach((b, i) => b.addEventListener('click', () => { takeOver(); rec.idx = i; sync(); }));

    /* ---- 换一张：转满整圈后随机落一张 ---- */
    const next = el.querySelector('.t-next');
    if (next) next.addEventListener('click', () => {
      if (next._busy) return;
      next._busy = true;
      wheel.classList.add('spin');          /* 关掉 CSS 过渡：JS 每帧已插值，否则 .6s 过渡再平滑一遍 = 抽风 */
      let target = Math.floor(Math.random() * n);
      if (target === rec.idx) target = (target + 1) % n;   /* 别原地不动 */
      const start = rec.idx;
      /* 关键：终点必须与 target 卡的几何完全重合，否则最后一帧和 sync()
         差出大半圈，同一张卡瞬间被拍过去 ~400px —— 那就是之前"抽风"的真凶。
         步距 360/n 后 period = 360/STEP = n 正好整数：终点 = target + m·n，
         几何与 target 完全重合，落位零跳变；m 取最小满足"至少转满一圈"。 */
      const period = 360 / STEP;                       /* = n（36° × 10 = 360°） */
      const forward = target - start;
      const m = Math.max(1, Math.ceil(1 - forward / period));
      const total = m * period + forward;              /* 总步数：至少转满一圈，且终点 ≡ target */
      /* 一步 ≈ 120ms（36° 步距比 26° 大，同样圈数要走得更快才跟得上），
         sine 缓动峰值速度只有三次缓动一半 → 弧顶峰值帧位移 ~55px */
      const dur = Math.max(1700, total * 120);
      const t0 = performance.now();
      const gen = spinToken;              /* 记下"我这代"的令牌 */
      (function spin() {
        if (gen !== spinToken) return;    /* 被点条/键盘/拖拽接管了：对方已摆好位，我直接退场 */
        const k = Math.min(1, (performance.now() - t0) / dur);
        /* sine 缓入缓出：起步不猛冲、落位不急停，全程单调（不会来回） */
        const e = (1 - Math.cos(Math.PI * k)) / 2;
        const cur = start + total * e;
        /* 高亮 = 真正在弧顶那张（折回角度最接近 0 的）。
           cur 是连续小数、也会超过一圈，逐张算折回角度取最小才对得准。 */
        let fi = 0, fb = Infinity;
        for (let j = 0; j < n; j++) {
          const a = Math.abs(Math.atan2(
            Math.sin((j - cur) * STEP * Math.PI / 180),
            Math.cos((j - cur) * STEP * Math.PI / 180)));
          if (a < fb) { fb = a; fi = j; }
        }
        rec.idx = fi;
        place(cur, 0);
        bars.forEach((b, j) => b.classList.toggle('on', j === fi));
        if (meta) meta.textContent = '第 ' + pad(fi + 1) + ' / ' + pad(n);
        if (k < 1) requestAnimationFrame(spin);
        else {
          /* 终点几何 ≡ target：sync() 换算整数索引时零跳变 */
          rec.idx = target % n;
          sync();
          wheel.classList.remove('spin');
          next._busy = false;
        }
      })();
    });

    /* ---- 就吃这个 ---- */
    const pick = el.querySelector('.t-pick');
    if (pick) pick.addEventListener('click', () => {
      const card = cards[rec.idx];
      if (!card) return;
      const r = findRec(card.dataset.id);
      if (!r) return;
      todayEaten.add(r.eat);
      card.classList.add('today');
      showToast('已记下：今天吃 <b>' + esc(r.eat) + '</b>', null, 2600);
    });

    /* ---- 拖：横向拖动 = 整排卡片绕外圆心摆，纵向留给页面滚动 ---- */
    let drag = null;
    wheel.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, base: lastPlaced };
      wheel.classList.add('drag');
      wheel.setPointerCapture && wheel.setPointerCapture(e.pointerId);
    });
    wheel.addEventListener('pointermove', (e) => {
      if (!drag) return;
      drag.dx = e.clientX - drag.x;
      drag.dy = e.clientY - drag.y;
      /* 明显是竖划就放弃拖拽，让页面正常滚 */
      if (Math.abs(drag.dy) > 10 && Math.abs(drag.dy) > Math.abs(drag.dx)) { endDrag(true); return; }
      if (Math.abs(drag.dx) > 4) { if (!drag.moved) takeOver(); drag.moved = true; }   /* 真拖起来 = 接管转圈 */
      /* 往左拖（dx<0）→ 摆向下一张（角度变正），跟手方向与弧线一致。
         基准用 pointerdown 时刻的真实位置 drag.base（转圈中是小数）——
         用 rec.idx 会从"转圈半路"瞬移到"最接近的整数张"，一上手就跳 */
      place(drag.base, (drag.dx / 300) * STEP * 1.4);
    });
    function endDrag(cancel) {
      if (!drag) return;
      const d = drag;
      drag = null;
      wheel.classList.remove('drag');
      /* 没真拖动（点一下、或纯竖划）：转圈还在跑就别去碰它；
         没转圈才弹回整数位（清掉微小的拖拽偏移） */
      if (!d.moved) { if (!wheel.classList.contains('spin')) sync(); return; }
      if (cancel) { sync(); return; }
      /* 换算成"摆几张"：拖过 28% 步距算一张，不足弹回原位 */
      const frac = -d.dx / 300;
      let go = Math.round(frac * 1.4);
      if (Math.abs(frac) < 0.2) go = 0;
      else if (go === 0) go = frac > 0 ? 1 : -1;
      rec.idx = ((rec.idx + go) % n + n) % n;
      sync();
    }
    wheel.addEventListener('pointerup', () => endDrag(false));
    wheel.addEventListener('pointercancel', () => endDrag(true));
    /* 拖完别让卡片把 click 也吞了 */
    wheel.addEventListener('click', (e) => {
      if (e.target.closest('.card')) e.stopPropagation();
    }, true);

    /* ---- 键盘：左右方向键摆 ---- */
    wheel.tabIndex = 0;
    wheel.setAttribute('role', 'group');
    wheel.setAttribute('aria-label', '今日推荐，左右方向键切换');
    wheel.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { takeOver(); rec.idx = (rec.idx - 1 + n) % n; sync(); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { takeOver(); rec.idx = (rec.idx + 1) % n; sync(); e.preventDefault(); }
    });

    sync();
  }

  function citiesHTML() {
    const map = new Map();
    pool.forEach((r) => {
      const key = r.city || '';
      if (!map.has(key)) map.set(key, { city: r.city, list: [] });
      map.get(key).list.push(r);
    });
    const rows = [...map.values()].map((o) => ({
      city: o.city,
      count: o.list.length,
      avg: o.list.reduce((s, r) => s + r.rating, 0) / o.list.length,
      top: o.list.slice().sort((a, b) => b.at.localeCompare(a.at))[0]
    }));

    /* 分组：首字母 → 该字母下的城市。组内仍按"道数多 → 分高"排，
       所以字母轨给的是"去哪一区"，组内顺序保留原来的价值排序。 */
    const groups = [];
    const gmap = new Map();
    rows.forEach((r) => {
      const key = initialOf(r.city);
      if (!gmap.has(key)) { const g = { letter: key, rows: [] }; gmap.set(key, g); groups.push(g); }
      gmap.get(key).rows.push(r);
    });
    groups.forEach((g) => g.rows.sort((a, b) =>
      b.count - a.count || b.avg - a.avg || String(a.city).localeCompare(String(b.city), 'zh-Hans-CN')));
    groups.sort((a, b) => {
      if (a.letter !== b.letter) {
        if (a.letter === '#') return 1;
        if (b.letter === '#') return -1;
        return a.letter < b.letter ? -1 : 1;
      }
      return 0;
    });

    const body = groups.map((g) =>
      '<section class="city-group" data-letter="' + g.letter + '">' +
      '<div class="city-group__h"><b>' + g.letter + '</b><i>' + g.rows.length + ' 座</i></div>' +
      g.rows.map((r) =>
        '<button class="city-row" type="button" data-city="' + esc(r.city || '') + '">' +
        '<span class="city-row__top"><span class="city-row__name">' + (r.city ? esc(r.city) : '未记城市') + '</span>' +
        '<span class="city-row__num">' + r.count + ' 道，' + r.avg.toFixed(1) + ' 分 <span class="city-row__chev" aria-hidden="true">›</span></span></span>' +
        '<span class="city-row__sub">最近 ' + esc(r.top.eat) + (r.top.shop ? ' ' + esc(r.top.shop) : '') + '，' + mmdd(r.top.at) + '</span>' +
        '</button>').join('') +
      '</section>').join('');

    return '' +
      '<div class="page__bar"><button class="pback" data-back type="button" aria-label="返回">←</button>' +
      '<span class="page__title">足迹</span><span class="page__meta">' + rows.length + ' 地，' + pool.length + ' 笔</span></div>' +
      '<div class="page__body">' +
      '<div class="city-groups">' + body +
      (rows.length ? '' : '<div class="page-empty">还没有记录。</div>') +
      '<div class="footnote">演示数据：12 条真实记录，其余为程序生成</div>' +
      '</div>' +
      '</div>' +
      /* 右侧字母轨：只放出现过的字母，点字母跳组。
         轨必须在滚动容器**外面**（.page 的直接子元素）——放进 page__body 里它会跟着内容滚走，
         翻两屏就看不见了，索引也就废了。 */
      '<nav class="city-rail" aria-label="城市首字母索引">' +
      groups.map((g) => '<b role="button" tabindex="0" data-goto="' + g.letter + '" aria-label="跳到 ' + g.letter + ' 组">' + g.letter + '</b>').join('') +
      '<span class="city-rail__tip" id="cityTip" aria-hidden="true"></span>' +
      '</nav>';
  }

  /* 足迹页的字母索引轨：点字母（或键盘）跳到对应分组，
     滚动时同步高亮当前所在组。写在自己的 scroll 监听里，不干扰墙的 rAF 合并。 */
  function bindCitiesIndex(rec) {
    const el = rec.el;
    const body = el.querySelector('.page__body');
    const rail = el.querySelector('.city-rail');
    const tip = el.querySelector('.city-rail__tip');
    if (!body || !rail) return;
    const keys = [...rail.querySelectorAll('[data-goto]')];
    const secs = [...el.querySelectorAll('.city-group')];
    let tipTimer = 0;

    /* 分组在 body 坐标系里的位置：offsetTop 是相对最近定位祖先（.page__body，已 position:relative） */
    const topOf = (sec) => sec.offsetTop - body.clientTop;

    function jump(letter) {
      const sec = secs.find((s) => s.dataset.letter === letter);
      if (!sec) return;
      /* 最后一组常常短于视口，scrollTo 到 offsetTop 会被浏览器钳到 maxScroll，
         看起来就是"没跳到底"。这里按 maxScroll 钳一次，和浏览器行为一致但结果可预期。 */
      const max = body.scrollHeight - body.clientHeight;
      body.scrollTop = Math.max(0, Math.min(topOf(sec), max));
      if (tip) {
        tip.textContent = letter;
        tip.classList.add('on');
        clearTimeout(tipTimer);
        tipTimer = setTimeout(() => tip.classList.remove('on'), 700);
      }
    }

    keys.forEach((k) => {
      const go = (e) => { e.preventDefault(); e.stopPropagation(); jump(k.dataset.goto); };
      k.addEventListener('click', go);
      k.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') go(e); });
    });

    /* 滚到哪一组，就把哪个字母点亮 —— 让轨同时是个"你在哪儿"的指示器 */
    let raf = 0;
    body.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const limit = body.scrollTop + 56;
        let cur = '';
        for (const s of secs) if (topOf(s) <= limit) cur = s.dataset.letter;
        keys.forEach((k) => k.classList.toggle('on', k.dataset.goto === cur));
      });
    }, { passive: true });
  }

  function cityHTML(city) {
    const label = city ? city : '未记城市';
    const list = pool.filter((r) => (r.city || '') === (city || '')).sort(SORTS[state.sort]);
    const avg = list.length ? list.reduce((s, r) => s + r.rating, 0) / list.length : 0;

    const shopMap = new Map();
    list.forEach((r) => {
      if (!r.shop) return;
      if (!shopMap.has(r.shop)) shopMap.set(r.shop, []);
      shopMap.get(r.shop).push(r);
    });
    const shops = [...shopMap.entries()].sort((a, b) => b[1].length - a[1].length);

    return '' +
      '<div class="page__bar"><button class="pback" data-back type="button" aria-label="返回">←</button>' +
      '<span class="page__title">' + esc(label) + '</span>' +
      '<span class="page__meta">' + list.length + ' 道</span></div>' +
      '<div class="page__body" data-citywall><div class="wall"></div>' +
      (shops.length
        ? '<div class="clist">' +
          '<div class="clist__h">在这座城市吃过的店</div>' +
          shops.map(([name, arr]) =>
            '<button class="dish-row" type="button" data-shop="' + esc(name) + '">' +
            '<span class="dish-row__name">' + esc(name) + '</span>' +
            '<span class="dish-row__date">' + arr.length + ' 道 ›</span></button>').join('') +
          '</div>'
        : '') +
      '<div class="page-foot">' + esc(label) + '，' + list.length + ' 道，均分 ' + avg.toFixed(1) + '</div></div>';
  }

  function shopHTML(shop) {
    const list = pool.filter((r) => r.shop === shop).sort((a, b) => b.at.localeCompare(a.at));
    const dishes = new Set(list.map((r) => r.eat));
    const avg = list.length ? list.reduce((s, r) => s + r.rating, 0) / list.length : 0;
    const city = (list.find((r) => r.city) || {}).city || '';

    return '' +
      '<div class="page__bar"><button class="pback" data-back type="button" aria-label="返回">←</button>' +
      '<span class="page__title">一家店</span><span class="page__meta">' + esc(city) + '</span></div>' +
      '<div class="page__body">' +
      '<div class="shop-head"><h1 class="shop-head__name">' + esc(shop) + '</h1>' +
      '<p class="shop-head__sub">' + esc([city, (list.find((r) => r.district) || {}).district].filter(Boolean).join(' ') || '未记城市') + '</p></div>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + list.length + '</b><span>去过几次</span></div>' +
      '<div class="stat"><b>' + dishes.size + '</b><span>点过几道</span></div>' +
      '<div class="stat"><b>' + avg.toFixed(1) + '</b><span>均分</span></div>' +
      '</div>' +
      list.map((r) => '' +
        '<button class="dish-row" type="button" data-open="' + r.id + '">' +
        '<span class="dish-row__name">' + esc(r.eat) + '</span>' +
        '<span class="dish-row__stars">' + marks(r.rating) + '</span>' +
        '<span class="dish-row__date">' + dateOf(r.at) + '</span>' +
        '</button>'
      ).join('') +
      '<div class="footnote">演示数据：12 条真实记录，其余为程序生成</div>' +
      '</div>';
  }

  $('btnCities').addEventListener('click', () => pushPage('cities', {}));
  $('btnRank').addEventListener('click', () => pushPage('rank', {}));
  $('btnToday').addEventListener('click', () => pushPage('today', {}));

  /* ================================================================
     12. 详情
     ================================================================ */
  let currentId = null;
  let lastFocus = null;

  function findRec(id) { return pool.find((r) => r.id === id) || null; }

  function openDetail(id) {
    if (performance.now() < pushLock) return;   /* 页面还在滑入：穿透点击不掀层，与 push 同一把锁（连点只进一层） */
    const r = findRec(id);
    if (!r) return;
    currentId = id;
    lastFocus = document.activeElement;

    dghost.textContent = Array.from(r.eat)[0] || '';
    dname.textContent = r.eat;
    dshop.textContent = placeOf(r);
    ddate.textContent = weekday(r.at) + ' ' + timeOf(r.at);
    dplate.dataset.tone = r.tone;
    dno.textContent = mmdd(r.at);
    drate.innerHTML = marks(r.rating);
    dstars.innerHTML = marks(r.rating) + '<b>' + (r.rating ? r.rating + ' 分' : '未评') + '</b>';
    dnote.textContent = r.note || '没有留下备注。';
    dnote.classList.toggle('is-empty', !r.note);
    dcount.textContent = dateOf(r.at);
    renderRelated(r);

    dbody.scrollTop = 0;
    detail.classList.add('in');
    toLatest.classList.remove('on');
    setTimeout(() => detail.focus({ preventScroll: true }), 260);
  }

  function renderRelated(r) {
    const out = [];

    if (r.shop) {
      const others = pool.filter((x) => x.shop === r.shop && x.id !== r.id)
        .sort((a, b) => b.at.localeCompare(a.at));
      out.push(
        '<div class="drel">' +
        '<button class="drel__h" type="button" data-shop-page="' + esc(r.shop) + '">' +
        '<span class="k">同一家店</span><span class="v">' + esc(r.shop) + '</span>' +
        '<span class="n">' + (others.length + 1) + ' 次</span><span class="c">›</span></button>' +
        (others.length
          ? '<div class="drel__list">' + others.slice(0, 6).map((x) =>
              '<button class="drel__chip" type="button" data-open="' + x.id + '">' + esc(x.eat) + '</button>').join('') +
            (others.length > 6 ? '<span class="drel__none">还有 ' + (others.length - 6) + ' 道</span>' : '') + '</div>'
          : '<div class="drel__none">这家店只有这一道。</div>') +
        '</div>'
      );
    } else {
      out.push('<div class="drel"><div class="drel__none" style="padding:10px 0">这笔没记店名。</div></div>');
    }

    if (r.city) {
      const others = pool.filter((x) => x.city === r.city && x.id !== r.id)
        .sort((a, b) => b.at.localeCompare(a.at));
      out.push(
        '<div class="drel">' +
        '<button class="drel__h" type="button" data-city-page="' + esc(r.city) + '">' +
        '<span class="k">同一城市</span><span class="v">' + esc(r.city) + '</span>' +
        '<span class="n">共 ' + (others.length + 1) + ' 道</span><span class="c">›</span></button>' +
        (others.length
          ? '<div class="drel__list">' + others.slice(0, 6).map((x) =>
              '<button class="drel__chip" type="button" data-open="' + x.id + '">' + esc(x.eat) + '</button>').join('') +
            (others.length > 6 ? '<span class="drel__none">还有 ' + (others.length - 6) + ' 道</span>' : '') + '</div>'
          : '<div class="drel__none">这座城市只有这一道。</div>') +
        '</div>'
      );
    } else {
      out.push('<div class="drel"><div class="drel__none" style="padding:10px 0">这笔没记城市。</div></div>');
    }

    drelWrap.innerHTML = out.join('');
    drelWrap.querySelectorAll('[data-open]').forEach((b) => {
      b.addEventListener('click', () => openDetail(b.dataset.open));
    });
    drelWrap.querySelectorAll('[data-shop-page]').forEach((b) => {
      b.addEventListener('click', () => { closeDetail(); pushPage('shop', { shop: b.dataset.shopPage }); });
    });
    drelWrap.querySelectorAll('[data-city-page]').forEach((b) => {
      b.addEventListener('click', () => { closeDetail(); pushPage('city', { city: b.dataset.cityPage }); });
    });
  }

  function closeDetail() {
    if (!detail.classList.contains('in')) return;
    detail.classList.remove('in');
    currentId = null;
    updateToLatest();
    if (lastFocus && lastFocus.focus) setTimeout(() => lastFocus.focus({ preventScroll: true }), 60);
  }
  dback.addEventListener('click', closeDetail);

  dEdit.addEventListener('click', () => {
    const r = findRec(currentId);
    if (r) openForm(r);
  });
  dDel.addEventListener('click', () => {
    const r = findRec(currentId);
    if (!r) return;
    closeDetail();
    doDelete(r);
  });

  /* ================================================================
     13. 删除 / 撤销
     ================================================================ */
  function doDelete(r) {
    undoIndex = pool.findIndex((x) => x.id === r.id);
    undoRecord = r;
    pool = pool.filter((x) => x.id !== r.id);
    home.setList(ordered(), false);
    updateChrome();
    if (pages.length) replaceTopPage();
    if (search.classList.contains('in')) runSearch();
    showToast('已删除 <b>' + esc(r.eat) + '</b>', () => {
      if (!undoRecord) return;
      pool.splice(Math.min(undoIndex, pool.length), 0, undoRecord);
      undoRecord = null;
      home.setList(ordered(), true);
      updateChrome();
      if (pages.length) replaceTopPage();
      if (search.classList.contains('in')) runSearch();
      hideToast();
    });
  }

  function showToast(html, onUndo, ms) {
    clearTimeout(toastTimer);
    toastT.innerHTML = html;
    toastUndo.style.display = onUndo ? '' : 'none';
    toast.classList.remove('on');
    void toast.offsetWidth;
    toast.classList.add('on');
    toastUndo.onclick = () => { if (onUndo) onUndo(); };
    toastTimer = setTimeout(() => { hideToast(); undoRecord = null; }, ms || 5000);
  }
  function hideToast() {
    toast.classList.remove('on');
    clearTimeout(toastTimer);
  }

  /* ================================================================
     14. 表单（贴一张 / 编辑）
     ================================================================ */
  let editingId = null;
  let formRating = 0;

  function shopHistory() {
    const seen = new Set();
    const out = [];
    pool.slice().sort((a, b) => b.at.localeCompare(a.at)).forEach((r) => {
      if (r.shop && !seen.has(r.shop)) { seen.add(r.shop); out.push(r.shop); }
    });
    return out;
  }
  function cityHistory() {
    const seen = new Set();
    const out = [];
    pool.slice().sort((a, b) => b.at.localeCompare(a.at)).forEach((r) => {
      if (r.city && !seen.has(r.city)) { seen.add(r.city); out.push(r.city); }
    });
    return out;
  }
  function districtHistory(city) {
    const seen = new Set();
    const out = [];
    pool.forEach((r) => {
      if (r.city === city && r.district && !seen.has(r.district)) { seen.add(r.district); out.push(r.district); }
    });
    return out;
  }

  function renderSug(box, items, onPick, limit) {
    const max = limit || 6;
    box.innerHTML = items.slice(0, max).map((t, i) =>
      '<button class="sg" type="button" data-i="' + i + '">' + esc(t) + '</button>').join('');
    box.querySelectorAll('.sg').forEach((b) => {
      b.addEventListener('click', (e) => { e.preventDefault(); onPick(items[Number(b.dataset.i)]); });
    });
  }

  function openForm(rec) {
    if (performance.now() < pushLock) return;   /* 同 openDetail：滑入过场中的穿透点击不开表单 */
    editingId = rec ? rec.id : null;
    fTitle.textContent = rec ? '编辑这一笔' : '贴一张';
    fSubmit.textContent = rec ? '存 下 来' : '贴 上 去';

    fEat.value = rec ? rec.eat : '';
    fShop.value = rec && rec.shop ? rec.shop : '';
    fCity.value = rec && rec.city ? rec.city : '';
    fDistrict.value = rec && rec.district ? rec.district : '';
    fAt.value = toInputValue(rec ? rec.at : stampNow());
    fNote.value = rec && rec.note ? rec.note : '';
    formRating = rec ? rec.rating : 0;
    syncFormStars();
    fEatField.classList.remove('bad');

    refreshShopSug();
    refreshCitySug();
    refreshDistrictSug();

    form.classList.add('in');
    toLatest.classList.remove('on');
    setTimeout(() => { if (!rec) fEat.focus({ preventScroll: true }); }, 300);
  }

  function closeForm() {
    form.classList.remove('in');
    editingId = null;
    updateToLatest();
  }

  function syncFormStars() {
    fStars.querySelectorAll('.star').forEach((s) => {
      const v = Number(s.dataset.v);
      s.classList.toggle('on', v <= formRating);
      s.setAttribute('aria-checked', String(v === formRating));
    });
    /* 让 CSS 按当前选中的分数给填充上色（色阶与展示端同一套） */
    fStars.dataset.pick = String(formRating || 0);
    fStarLabel.textContent = formRating ? formRating + ' 星' : '未评';
  }

  function refreshShopSug() {
    const q = fShop.value.trim();
    const all = shopHistory();
    let items = q ? all.filter((s) => s.includes(q) && s !== q) : all;
    if (!items.length && q) items = all.filter((s) => s !== q);
    renderSug(fShopSug, items, (v) => { fShop.value = v; refreshShopSug(); }, 5);
  }
  function refreshCitySug() {
    const q = fCity.value.trim();
    const all = cityHistory();
    let items = q ? all.filter((s) => s.includes(q) && s !== q) : all;
    if (!items.length && q) items = all.filter((s) => s !== q);
    renderSug(fCitySug, items, (v) => {
      fCity.value = v;
      if (!districtHistory(v).includes(fDistrict.value)) fDistrict.value = '';
      refreshCitySug(); refreshDistrictSug();
    }, 6);
  }
  function refreshDistrictSug() {
    const city = fCity.value.trim();
    if (!city) { fDistrictSug.innerHTML = ''; fDistrict.disabled = true; return; }
    fDistrict.disabled = false;
    const q = fDistrict.value.trim();
    const all = districtHistory(city);
    let items = q ? all.filter((s) => s.includes(q) && s !== q) : all;
    if (!items.length && q) items = all.filter((s) => s !== q);
    renderSug(fDistrictSug, items, (v) => { fDistrict.value = v; refreshDistrictSug(); }, 5);
  }

  fStars.addEventListener('click', (e) => {
    const s = e.target.closest('.star');
    if (!s) return;
    formRating = Number(s.dataset.v);
    syncFormStars();
  });
  fShop.addEventListener('input', refreshShopSug);
  fCity.addEventListener('input', () => { refreshCitySug(); refreshDistrictSug(); });
  fDistrict.addEventListener('input', refreshDistrictSug);
  fEat.addEventListener('input', () => { if (fEat.value.trim()) fEatField.classList.remove('bad'); });
  fEat.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveForm(); } });
  fCancel.addEventListener('click', closeForm);
  fSubmit.addEventListener('click', saveForm);

  function saveForm() {
    const eat = fEat.value.trim();
    if (!eat) {
      fEatField.classList.remove('bad');
      void fEatField.offsetWidth;
      fEatField.classList.add('bad');
      fEat.focus({ preventScroll: true });
      return;
    }
    const data = {
      eat: Array.from(eat).slice(0, 12).join(''),
      shop: fShop.value.trim() || null,
      city: fCity.value.trim() || null,
      district: (fCity.value.trim() && fDistrict.value.trim()) || null,
      rating: formRating,
      at: fromInputValue(fAt.value),
      note: fNote.value.trim() || null
    };

    if (editingId) {
      const r = findRec(editingId);
      if (r) Object.assign(r, data);
      closeForm();
      home.setList(ordered(), false);
      updateChrome();
      if (pages.length) replaceTopPage();
      if (search.classList.contains('in')) runSearch();
      if (r) openDetail(r.id);
    } else {
      const rec = { id: 'u' + Date.now(), span: 'wide', tone: 'paper', ...data };
      pool.unshift(rec);
      closeForm();
      board.scrollTop = 0;
      home.setList(ordered(), false);
      updateChrome();
      if (pages.length) replaceTopPage();
      if (search.classList.contains('in')) runSearch();

      const node = home.nodes.get(rec.id);
      const entry = home.byId.get(rec.id);
      if (entry) board.scrollTop = Math.max(0, entry.y - 30);
      if (node) {
        node.el.classList.add('just-added');
        node.el.animate(
          [{ opacity: 0, transform: 'scale(1.05)' }, { opacity: 1, transform: 'scale(1)' }],
          { duration: 420, easing: 'cubic-bezier(.22,.86,.2,1)' }
        );
        setTimeout(() => node.el.classList.remove('just-added'), 1600);
        setTimeout(() => node.el.focus({ preventScroll: true }), 140);
      }
      suppressUntil = performance.now() + 400;
    }
  }

  $('fab').addEventListener('click', () => openForm(null));
  $('emptyFab').addEventListener('click', () => openForm(null));

  /* ================================================================
     15. 搜索
     ================================================================ */
  function matches(r, q) {
    if (!q) return true;
    return [r.eat, r.shop, r.city, r.district].filter(Boolean).join(' ').toLowerCase().includes(q.toLowerCase());
  }

  function openSearch() {
    search.classList.add('in');
    sInput.value = '';
    renderSearchSuggest();
    runSearch();
    setTimeout(() => sInput.focus({ preventScroll: true }), 300);
    toLatest.classList.remove('on');
  }
  function closeSearch() {
    search.classList.remove('in');
    sInput.blur();
    updateToLatest();
  }

  function renderSearchSuggest() {
    const picks = [];
    ['甜水面', '成都', '马旺子川小馆', '烤鸭'].forEach((p) => picks.push(p));
    sSuggest.innerHTML =
      '<p class="sug__h">搜菜名、店、城市、区县</p><div class="sug__list">' +
      picks.map((p) => '<button class="sug__b" type="button" data-q="' + esc(p) + '">' + esc(p) + '</button>').join('') +
      '</div>';
    sSuggest.querySelectorAll('[data-q]').forEach((b) => {
      b.addEventListener('click', () => { sInput.value = b.dataset.q; runSearch(); sInput.focus(); });
    });
  }

  function runSearch() {
    const q = sInput.value.trim();
    const list = pool.filter((r) => matches(r, q)).sort(SORTS[state.sort]);

    if (!q) {
      searchWall.setList([], false);
      sHits.textContent = '';
      sToWall.style.display = 'none';
      sSuggest.style.display = '';
      sEmpty.style.display = 'none';
      swall.style.display = 'none';
      $('sEnd').textContent = '';
      return;
    }

    sSuggest.style.display = 'none';
    swall.style.display = '';
    sHits.textContent = '「' + q + '」命中 ' + list.length + ' 笔';
    sToWall.style.display = 'inline';
    searchWall.setList(list, false);
    $('sEnd').textContent = list.length ? '— 共 ' + list.length + ' 笔 —' : '';

    if (!list.length) {
      sEmpty.style.display = 'block';
      $('sEmptyT').textContent = '没找到「' + q + '」。';
      swall.style.display = 'none';
    } else {
      sEmpty.style.display = 'none';
    }
  }

  sInput.addEventListener('input', runSearch);
  sClear.addEventListener('click', () => {
    if (sInput.value) { sInput.value = ''; runSearch(); sInput.focus(); }
    else closeSearch();
  });
  sBack.addEventListener('click', closeSearch);
  sToWall.addEventListener('click', () => { sInput.value = ''; runSearch(); closeSearch(); });
  $('sEmptyB').addEventListener('click', () => { sInput.value = ''; runSearch(); sInput.focus(); });
  $('btnSearch').addEventListener('click', openSearch);

  /* ================================================================
     16. 键盘
     ================================================================ */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (form.classList.contains('in')) { closeForm(); return; }
    if (toast.classList.contains('on')) { hideToast(); return; }
    if (detail.classList.contains('in')) { closeDetail(); return; }
    if (search.classList.contains('in')) { closeSearch(); return; }
    if (pages.length) { popPage(); return; }
  });

  /* ================================================================
     17. 起步
     ================================================================ */
  home.setList(ordered(), false);
  updateChrome();
  updateToLatest();
})();
</script>
</body>
</html>
